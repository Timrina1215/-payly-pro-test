<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light" data-bg="default">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Payly Pro</title>
    <meta name="description" content="Payly Pro estimates gross pay, tax, and take-home pay. Your salary data stays on your device." />
    <meta name="theme-color" content="#0c100e" id="theme-color" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d5c45'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia,serif' font-size='36' fill='%23f7fffb'%3EP%3C/text%3E%3C/svg%3E" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("payly-pro");
          var data = raw ? JSON.parse(raw) : null;
          var theme = data && data.theme;
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
          var lang = data && data.lang;
          if (lang === "en" || lang === "ru" || lang === "fr" || lang === "ar") {
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
          }
          var bg = data && data.background;
          if (bg !== "photo" && bg !== "none" && bg !== "default") bg = "default";
          document.documentElement.setAttribute("data-bg", bg);
        } catch (err) {
          document.documentElement.setAttribute("data-theme", "light");
          document.documentElement.setAttribute("data-bg", "default");
        }
      })();
    </script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="top">
        <div class="brand">
          <span class="mark" aria-hidden="true">P</span>
          <div class="brand-text">
            <h1 class="brand-name"><span id="app-title">Payly Pro</span><span class="pro">PRO</span></h1>
            <p class="brand-sub" data-i18n="subtitle"></p>
          </div>
        </div>
        <div class="toolbar">
          <div class="switch" id="lang-switch" role="radiogroup" data-i18n="language" data-i18n-attr="aria-label">
            <button type="button" role="radio" data-lang="en">EN</button>
            <button type="button" role="radio" data-lang="ru">RU</button>
            <button type="button" role="radio" data-lang="fr">FR</button>
            <button type="button" role="radio" data-lang="ar" lang="ar">ع</button>
          </div>
          <button type="button" class="theme-btn" id="theme-toggle">
            <span id="theme-icon" aria-hidden="true"></span>
            <span class="theme-label" id="theme-label"></span>
          </button>
        </div>
      </header>

      <div id="view-calc">
        <div class="workspace">
          <div class="workspace-form">
            <section class="panel">
              <h2 class="sr-only" data-i18n="calculate"></h2>
              <div class="switch switch-currency" id="currency-switch" role="radiogroup" data-i18n="currency" data-i18n-attr="aria-label"></div>
              <p class="hint" data-i18n="currencyHint"></p>
              <div class="modes" id="mode-switch" role="tablist" data-i18n="mode" data-i18n-attr="aria-label">
                <button type="button" role="tab" data-mode="hourly" data-i18n="hourly"></button>
                <button type="button" role="tab" data-mode="monthly" data-i18n="monthly"></button>
              </div>
              <div id="panel-hourly">
                <div class="field">
                  <label for="hourly-rate" data-i18n="hourlyRate"></label>
                  <div class="control" data-control="hourly-rate"><input id="hourly-rate" inputmode="decimal" maxlength="18" autocomplete="off" /><span class="suffix currency-suffix">$</span></div>
                  <p class="field-error" data-for="hourly-rate"></p>
                </div>
                <div class="field">
                  <label for="hours-week" data-i18n="hoursPerWeek"></label>
                  <div class="control" data-control="hours-week"><input id="hours-week" inputmode="decimal" maxlength="8" autocomplete="off" /><span class="suffix" data-i18n="hoursSuffix"></span></div>
                  <p class="field-hint" data-i18n="hoursHint"></p>
                  <p class="field-error" data-for="hours-week"></p>
                </div>
              </div>
              <div id="panel-monthly" hidden>
                <div class="field">
                  <label for="monthly-salary" data-i18n="monthlySalary"></label>
                  <div class="control" data-control="monthly-salary"><input id="monthly-salary" inputmode="decimal" maxlength="18" autocomplete="off" /><span class="suffix currency-suffix">$</span></div>
                  <p class="field-error" data-for="monthly-salary"></p>
                </div>
              </div>
              <div class="field">
                <label for="tax-rate" data-i18n="taxRate"></label>
                <div class="control" data-control="tax-rate"><input id="tax-rate" inputmode="decimal" maxlength="8" autocomplete="off" /><span class="suffix">%</span></div>
                <p class="field-hint" data-i18n="taxHint"></p>
                <p class="field-error" data-for="tax-rate"></p>
              </div>
            </section>
          </div>
          <div class="workspace-results">
            <div class="period-switch" id="period-switch" role="radiogroup" data-i18n="periodView" data-i18n-attr="aria-label">
              <button type="button" role="radio" data-period="week" data-i18n="weekly"></button>
              <button type="button" role="radio" data-period="month" data-i18n="monthRow"></button>
              <button type="button" role="radio" data-period="year" data-i18n="annual"></button>
            </div>
            <section class="hero" aria-live="polite">
              <div class="hero-kicker"><span class="pill" data-i18n="estimate"></span><span data-i18n="net"></span></div>
              <p class="hero-value num" id="net-hero">—</p>
              <p class="hero-period" id="hero-period"></p>
              <div class="hero-split" id="hero-split"></div>
            </section>
            <div class="actions">
              <button type="button" class="btn btn-primary" id="save-calc" data-i18n="saveCalculation"></button>
              <button type="button" class="btn btn-ghost" id="copy-result" data-i18n="copyResult"></button>
            </div>
            <p class="live" id="live" aria-live="polite"></p>
            <p class="note" id="copy-failed" hidden></p>
            <section class="stats">
              <article class="stat"><h2 data-i18n="gross"></h2><p class="num" id="gross-now">—</p><p class="stat-sub" id="gross-cap"></p></article>
              <article class="stat"><h2 data-i18n="taxes"></h2><p class="num" id="tax-now">—</p><p class="stat-sub" id="tax-cap"></p></article>
            </section>
            <section class="breakdown"><h2 data-i18n="breakdown"></h2><ul class="break-list" id="breakdown-list"></ul></section>
            <p class="note" data-i18n="formula"></p>
            <p class="note" data-i18n="disclaimer"></p>
            <p class="privacy"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 10V8a4 4 0 0 1 8 0v2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span data-i18n="privacy"></span></p>
            <button type="button" class="reset" id="reset" data-i18n="reset"></button>
          </div>
        </div>
      </div>

      <div id="view-calendar" class="stack" hidden>
        <section class="cal-card" data-i18n="calendarLabel" data-i18n-attr="aria-label">
          <div class="cal-head">
            <button type="button" class="icon-btn" id="prev-month" data-i18n="prevMonth" data-i18n-attr="aria-label"><span class="flip-icon" aria-hidden="true">‹</span></button>
            <h2 id="month-title"></h2>
            <button type="button" class="icon-btn" id="next-month" data-i18n="nextMonth" data-i18n-attr="aria-label"><span class="flip-icon" aria-hidden="true">›</span></button>
          </div>
          <div class="weekdays" id="weekdays"></div>
          <div class="days" id="days"></div>
        </section>
        <section class="summary-card" data-i18n="monthlySummary" data-i18n-attr="aria-label">
          <h2 class="block-title" data-i18n="monthlySummary"></h2>
          <div id="month-summary"></div>
          <p class="summary-note" data-i18n="totalsHint"></p>
        </section>
      </div>

      <div id="view-history" class="stack" hidden>
        <section class="history-card">
          <h2 class="block-title" data-i18n="navHistory"></h2>
          <p class="lead" data-i18n="historyLead"></p>
          <p class="empty" id="history-empty" data-i18n="historyEmpty"></p>
          <ul class="history-list" id="history-list"></ul>
        </section>
      </div>

      <div id="view-settings" class="stack" hidden>
        <section class="settings-card">
          <h2 class="block-title" data-i18n="navSettings"></h2>
          <p class="lead" data-i18n="settingsLead"></p>
          <div class="field">
            <label for="app-name" data-i18n="appName"></label>
            <div class="control plain"><input id="app-name" maxlength="32" autocomplete="off" /></div>
            <p class="field-hint" data-i18n="appNameHint"></p>
          </div>
          <p class="section-label" data-i18n="accent"></p>
          <div class="swatches" id="swatches" role="radiogroup" data-i18n="accent" data-i18n-attr="aria-label"></div>
          <div class="color-row">
            <input type="color" id="accent-color" value="#0d5c45" data-i18n="accent" data-i18n-attr="aria-label" />
            <span id="accent-label"></span>
          </div>
          <p class="section-label" data-i18n="textColor"></p>
          <div class="color-row">
            <input type="color" id="text-color" value="#202522" data-i18n="textColor" data-i18n-attr="aria-label" />
            <span id="text-color-label"></span>
          </div>
          <div class="field appearance-field">
            <label for="text-outline" data-i18n="textOutline"></label>
            <div class="control plain"><select id="text-outline">
              <option value="none" data-i18n="outlineNone"></option>
              <option value="black" data-i18n="outlineBlack"></option>
              <option value="white" data-i18n="outlineWhite"></option>
            </select></div>
          </div>
          <div class="field appearance-field">
            <label for="outline-strength" data-i18n="outlineStrength"></label>
            <div class="control plain"><select id="outline-strength">
              <option value="thin" data-i18n="strengthThin"></option>
              <option value="medium" data-i18n="strengthMedium"></option>
              <option value="strong" data-i18n="strengthStrong"></option>
            </select></div>
          </div>
          <button type="button" class="secondary appearance-reset" id="reset-appearance" data-i18n="resetAppearance"></button>
        </section>
        <section class="settings-card">
          <h2 class="block-title" data-i18n="background"></h2>
          <div class="bg-switch" id="bg-switch" role="radiogroup" data-i18n="background" data-i18n-attr="aria-label">
            <button type="button" role="radio" data-bg="default" data-i18n="bgDefault"></button>
            <button type="button" role="radio" data-bg="photo" data-i18n="bgPhoto"></button>
            <button type="button" role="radio" data-bg="none" data-i18n="bgNone"></button>
          </div>
          <p class="lead" id="bg-hint"></p>
        </section>
      </div>

      <nav class="dock" id="dock">
        <button type="button" data-tab="calc"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg><span data-i18n="navCalc"></span></button>
        <button type="button" data-tab="calendar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg><span data-i18n="navCalendar"></span></button>
        <button type="button" data-tab="history"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg><span data-i18n="navHistory"></span></button>
        <button type="button" data-tab="settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg><span data-i18n="navSettings"></span></button>
      </nav>
    </div>

    <dialog id="day-sheet" class="sheet day-sheet">
      <div class="day-sheet-inner">
        <div class="sheet-head">
          <div><h2 id="day-sheet-title"></h2><p class="lead" id="day-sheet-count"></p></div>
          <button type="button" class="icon-btn" id="day-sheet-close" data-i18n="close" data-i18n-attr="aria-label">×</button>
        </div>
        <div class="day-entry-list" id="day-entry-list"></div>
        <div class="sheet-actions"><button type="button" class="btn btn-primary" id="day-add-entry" data-i18n="addAnotherEntry"></button></div>
      </div>
    </dialog>

    <dialog id="sheet" class="sheet">
      <form id="entry-form">
        <div class="sheet-head">
          <h2 id="entry-title"></h2>
          <button type="button" class="icon-btn" id="sheet-close" data-i18n="close" data-i18n-attr="aria-label">×</button>
        </div>
        <p class="banner" id="replace-warning" hidden></p>
        <p class="lead" id="amounts-follow" hidden></p>
        <div class="field">
          <label for="entry-date" data-i18n="date"></label>
          <div class="control plain" data-control="entry-date"><input id="entry-date" type="date" /></div>
          <p class="field-error" data-for="entry-date"></p>
        </div>
        <div class="field">
          <label for="entry-gross" data-i18n="gross"></label>
          <div class="control" data-control="entry-gross"><input id="entry-gross" inputmode="decimal" maxlength="18" /><span class="suffix" id="entry-symbol">$</span></div>
          <p class="field-error" data-for="entry-gross"></p>
        </div>
        <div class="field">
          <label for="entry-tax" data-i18n="taxes"></label>
          <div class="control" data-control="entry-tax"><input id="entry-tax" inputmode="decimal" maxlength="18" /><span class="suffix entry-symbol">$</span></div>
          <p class="field-error" data-for="entry-tax"></p>
        </div>
        <div class="field">
          <label for="entry-net" data-i18n="net"></label>
          <div class="control" data-control="entry-net"><input id="entry-net" inputmode="decimal" maxlength="18" /><span class="suffix entry-symbol">$</span></div>
          <p class="field-error" data-for="entry-net"></p>
        </div>
        <div class="field">
          <label for="entry-hours" data-i18n="hours"></label>
          <div class="control" data-control="entry-hours"><input id="entry-hours" inputmode="decimal" maxlength="8" /><span class="suffix" data-i18n="hoursSuffix"></span></div>
          <p class="field-error" data-for="entry-hours"></p>
        </div>
        <div class="field">
          <label for="entry-note" data-i18n="note"></label>
          <div class="control plain"><textarea id="entry-note" maxlength="500" data-i18n="notePlaceholder" data-i18n-attr="placeholder"></textarea></div>
        </div>
        <div class="sheet-actions" id="sheet-actions"></div>
      </form>
    </dialog>
    <script src="./i18n.js"></script>
    <script src="./money.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
